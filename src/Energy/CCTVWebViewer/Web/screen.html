<script language=javascript>

		//새로고침 막는 부분///////////////////////////////////////////////////////////////////////////////////
		window.document.onkeydown = protectKey;
		
		function down() {
			window.footer_cart.scrollBy(0,31)
			return;
		}		
		function up() {
			window.footer_cart.scrollBy(0,-31)
			return;
		}		
		function protectKey()
		{
			//새로고침을 막는 스크립트.. F5 번키..
			if(event.keyCode == 116)
			{
				event.keyCode = 0;
				return false;
			}
			// F11
			if(event.keyCode == 122)
			{
				event.keyCode = 0;
				return false;
			}
			//CTRL + N 즉 새로 고침을 막는 스크립트....
			else if ((event.keyCode == 78) && (event.ctrlKey == true))
			{
				event.keyCode = 0;
				return false;
			}
		}
		/////////////////////////////////////////////////////////////////////////////////////////////////////////
		
		// Button Event
		function SetCamera(e, i)
		{
			var str = "";
			str = "offsetX: " + (event.offsetX == undefined ? event.layerX : event.offsetX);
			str += ", offsetY: " + (event.offsetY == undefined ? event.layerY : event.offsetY);
			str += "<br/>screenX: " + event.screenX;
			str += ", screenY : " + event.screenY;
			str += "<br/>clientX : " + event.clientX;
			str += ", clientY : " + event.clientY;
			str += "<br/>pageX : " + event.pageX;
			str += ", pageY : " + event.pageY;
			str += ", i = " + i;

			alert(str);
		}
		
		function SetPtz(e, i)
		{
		}
		/////////////////////////////////////////////////////////////////////////////////////////////////////////
		
		function OnClick()
		{
			// FullScreen
			if(event.pageX == 20)
				requestFullScreen();
			// Camera Change
			if(event.pageX <= 16)
			{
				var nCamID = event.pageX - 1;
				WebClient.SelectCamera( nCamID );
			}
			else if(event.pageX >= 33 && event.pageX <= 66)	// Ptz
			{
				var nCmd = event.pageX;
				WebClient.SendPtzControl(nCmd, 2);
			}
			
			// 확인 Message
			var str = "";
			if(event.pageX <= 16)
			{
				str = "Camera " + event.pageX + "번";
			}
			else if(event.pageX >= 33 && event.pageX <= 66)	// Ptz
			{
				str = "Ptz : ";
				if(nCmd == 33)
					str += "Up";
				else if(nCmd == 34)	
					str += "Down";
				else if(nCmd == 35)
					str += "Right";
				else if(nCmd == 36)
					str += "Left";
				else if(nCmd == 37)
					str += "Zoom Out";
				else if(nCmd == 38)
					str += "Zoom In";
				else if(nCmd == 39)
					str += "Focus In";
				else if(nCmd == 40)
					str += "Focus Out";
				else if(nCmd == 41)
					str += "Up Left";
				else if(nCmd == 42)
					str += "Up Right";
				else if(nCmd == 43)
					str += "Down Left";
				else if(nCmd == 44)
					str += "Down Right";
				else if(nCmd == 51)
					str += "Auto";
				else if(nCmd == 65)
					str += "IRIS Out";
				else
					str += "IRIS In";
			}
			alert(str);
		}
		
		function OnLoad()

		}
		
		function requestFullScreen() {
			var i = document.getElementById("sView");
			if (i.requestFullscreen) {
				i.requestFullscreen();
			} else if (i.webkitRequestFullscreen) {
				i.webkitRequestFullscreen();
			} else if (i.mozRequestFullScreen) {
				i.mozRequestFullScreen();
			} else if (i.msRequestFullscreen) {
				i.msRequestFullscreen();
			}
		}
				
		function OnCreate()
		{		
			Login();						
			WebClient.CheckUserRight();
			SetSplit();
			SetCamera();
			document.WebClient.click();
		}

		function OnUseAudio(onoff)

		function Logout() {
			if(g_popup && !g_popup.closed) {
				g_popup.close();
				g_popup = 0;
			}
			
			location.href="login.html";
		}

		function fullscreen()
		{		
			document.WebClient.focus();
			WebClient.FullScreen();			
			document.camera_time.Split.focus();
		}
		
		function OnSetDisplayMode( mode )		
		{
			if( mode == 0){
				fullscreen();
				g_curSplit = mode - 1;
				split_check();
				return true;
			}
			g_curSplit = mode - 1;
			WebClient.SetDisplayMode( mode - 1 ); 
		}
		
		function OnSelectCamera( nCameraID )	
		{				
			g_curchannel = nCameraID;
			
			sel=document.camera_time.Camera
			for (i=sel.length-1; i>=0; i--) {
				if(sel.options[i].value == g_curchannel) {
					selected_camera = i;
					break;
				}
			}
			
			WebClient.SelectCamera( nCameraID ); 	
			IsPtzSupport();
		}		
		
		function IsPtzSupport()
		{				
			if((Support == WebClient.IsPtz) &&
   			 (ptzcpas ==WebClient.PtzCaps)){
			  	return true;
			}
				
			Support = WebClient.IsPtz;
			ptzcpas =WebClient.PtzCaps;
			ex_auto=0;
			ex_support=0;
			ex_corner=0;
			if(ptzcpas & 1)
			 	ex_auto =1;
 			if(ptzcpas & 256)
		 		ex_corner =1;
 			if(ptzcpas & 1024)
		 		ex_support =1;
 			if(ptzcpas & 2048)
		 		ex_support =1;
			window.control.PtzSupport(Support,ex_corner,ex_support,ex_auto);
		}
		
		function mode_change(mode) { 		
			if(mode == 1) {	//control_page
			//	Support = 1;
				WebClient.StartCaptureMode();
				SetCamera();	
				window.control.PtzSupport(Support,ex_corner,ex_support,ex_auto);		
			}
			else {				//search.page				
				WebClient.StartSearchMode();
				Search_SetCamera();				
			}
			g_mode = mode;
			g_userRight = 0; 
		}
		
		//로딩 하는 중 페이지 이동을 막기 위함

		function OnAudioControl(onoff) { WebClient.AudioControl(onoff); }
		
		function open_map() {
			g_popup = open('emap.html', 'popup', 'width=600, height=480, toolbar=no, status=no, scrollbars=no z-lock=yes');
		}
		/////////////////////////////////////////////////////////////////////////////////////////////////////////////////////

		{
			WebClient.SetPlayerTime(year, month, day, hour, minute);
		}
		
		function OnSaveDlg() { WebClient.ShowSavePopup(); }
		
		function OnPlayMode( nPlayMode ) { 			
			WebClient.Play( nPlayMode, 0 );		
		}								
				
		/////////////////////////////////////////////////////////////////////////////////////////////////////////////////////		
		
		function channel_check() {
			if(g_curchannel != WebClient.CurChannel) {				
				g_curchannel = WebClient.CurChannel;				
				for(j=0; j<=g_curchannel; j++){
					if(document.camera_time.Camera.options[j].value == g_curchannel){
						document.camera_time.Camera.selectedIndex = j;
						OnSelectCamera(document.camera_time.Camera.options[j].value);
						break;
					}
				}
			}			
		}
		
		function split_check() {
			if(g_curSplit != WebClient.DisplayMode){			
				g_curSplit = WebClient.DisplayMode;
				document.camera_time.Split.selectedIndex = WebClient.DisplayMode + 1;															    
			    }			    					   
		}
		
		function startTimer() {												
			
			if(g_userRight == 0) {
				OnUserRight();
			}						
			timerID = setTimeout("startTimer()",1000)
		}			
		function OnCemera()
		{				
			if(document.camera_time.Camera.length == 0)
				return false;
			if(document.camera_time.Camera.options[selected_camera].text == 0)			
				return false;
			OnSelectCamera(document.camera_time.Camera.options[selected_camera].value);			
		}			
		
		function OnUserRight()
		{
			WebClient.CheckUserRight();
			g_userRight = WebClient.UserRight;				
			if(g_userRight > 0) {				
				window.control.OnUserRight();			
			}			
		}
				
		//ATL -> Web event message
		function WebDvr_EClientNotify() {				
			switch ( WebClient.cur_connect ) {				
			case 3:		//disconnected
				if(connect_count == 5){
					alert("<?DISCONNECTED?>");	
					connect_count = 0;					
          			Logout();
				}
				else{									
					connect_count ++ ;					
					Login();					
				}
				break;				
			case 4:		//login_failed
				if(connect_count == 0){
					alert("<?LOGIN_FAIL?>");	
					Logout();
				}
				break;					
			case 5:		//relogin count zero setting
				connect_count = 0;
				break;
			case 6:		//emap_click				
				open_map();
				break;
			case 7:		//screen double_click
				split_check();
				break;
			case 8:		//screen click
				channel_check();
				break;
			case 9:
 				OnSelectCamera(g_curchannel );
				break;
			case 10:
				alert("<?LOGIN_MULTI?>");	
				Logout();
			  break;
			default:				
				break;
			}			
		}				
		
		function Unload(){
			sel=document.camera_time.Camera
			for (i=sel.length-1; i>=0; i--)
				sel.options[i].text = '';
		}
	//-->
</SCRIPT>
