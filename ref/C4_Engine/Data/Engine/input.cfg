$device = "Mouse";
bind "Wheel" %next;
bind "Button 0" %fire;
bind "Button 1" %trig;

$device = "Keyboard";
bind "1" %pist;
bind "2" %shgn;
bind "3" %cbow;
bind "4" %spsh;
bind "5" %gren;
bind "6" %qchg;
bind "7" %rock;
bind "8" %plas;
bind "9" %pcan;
bind "W" %frwd;
bind "T" %mess;
bind "Y" %camr;
bind "A" %left;
bind "S" %bkwd;
bind "D" %rght;
bind "F" %lite;
bind "X" %scor;
bind "C" %down;
bind "Space" %jump;
bind "F5" %save;
bind "F9" %load;

undef $device;
